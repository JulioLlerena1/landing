<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>landing</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <script>
  // Initial check on load
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (systemPrefersDark) {
    document.documentElement.classList.add('dark');
  }

  // Wait for DOM to load, then attach instant click handler
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('theme-switcher');
    
    btn.addEventListener('click', () => {
      // Flips the class instantly; browser swaps the CSS variables on the fly
      document.documentElement.classList.toggle('dark');
    });
  });
  </script>

  <style type="text/tailwindcss">
    /* Theme configuration mapping custom utility keys to native CSS variables */
    @theme {
      --color-neutral-primary: var(--neutral-primary);
      --color-neutral-secondary-soft: var(--neutral-secondary-soft);
      --color-neutral-tertiary: var(--neutral-tertiary);
      --color-default: var(--border-default);
      --color-heading: var(--text-heading);
      --color-body: var(--text-body);
      --color-brand: var(--brand-bg);
      --color-fg-brand: var(--brand-fg);
      --radius-base: var(--radius);
    }

    /* Default Light Mode Token definitions */
    :root {
      --neutral-primary: #ffffff;
      --neutral-secondary-soft: #f8fafc; /* slate-50 */
      --neutral-tertiary: #cbd5e1;       /* slate-300 */
      --border-default: #e2e8f0;         /* slate-200 */
      --text-heading: #0f172a;           /* slate-900 */
      --text-body: #475569;              /* slate-600 */
      --brand-bg: #1d4ed8;               /* blue-700 */
      --brand-fg: #1d4ed8;               /* blue-700 */
      --radius: 0.375rem;
    }

    /* Automatic variant override when .dark class is added to <html> */
    .dark {
      --neutral-primary: #0f172a;        /* slate-900 */
      --neutral-secondary-soft: #1e293b; /* slate-800 */
      --neutral-tertiary: #334155;       /* slate-700 */
      --border-default: #334155;         /* slate-700 */
      --text-heading: #f8fafc;           /* slate-50 */
      --text-body: #94a3b8;              /* slate-400 */
      --brand-bg: #2563eb;               /* blue-600 */
      --brand-fg: #38bdf8;               /* sky-400 */
    }
  </style>
</head>

<body>

  <nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">

      <a href="https://flowbite.com/" class="flex items-center space-x-3 rtl:space-x-reverse">
        <img src="https://flowbite.com/docs/images/logo.svg" class="h-7" alt="Flowbite Logo" />
        <span class="self-center text-xl text-heading font-semibold whitespace-nowrap">Flowbite</span>
      </a>

      <button data-collapse-toggle="navbar-default" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
        aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
      <div class="hidden w-full md:block md:w-auto" id="navbar-default">
        <ul
          class="font-medium flex flex-col p-4 md:p-0 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-neutral-primary">
          <li>
            <a href="#" class="block py-2 px-3 text-white bg-brand rounded md:bg-transparent md:text-fg-brand md:p-0"
              aria-current="page">Home</a>
          </li>
          <li>
            <a href="#"
              class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">About</a>
          </li>
          <li>
            <a href="#"
              class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Services</a>
          </li>
          <li>
            <a href="#"
              class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Pricing</a>
          </li>
          <li>
            <a href="#"
              class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:border-0 md:hover:text-fg-brand md:p-0 md:dark:hover:bg-transparent">Contact</a>
          </li>
          <li>
            <button id="theme-switcher" class="px-3 text-sm font-medium text-heading bg-neutral-secondary-soft rounded-base border border-default cursor-pointer">
            Toggle Theme
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="bg-neutral-primary pt-20">
  <div id="container-01" class="mx-auto px-4 py-20 text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-heading">
      Tu presencia digital comienza aquí
    </h1>
    <p class="mt-6 text-lg leading-relaxed text-body max-w-2xl mx-auto">
      Creamos experiencias web atractivas y rápidas con Tailwind CSS. 
      Dale vida a tus ideas con un diseño moderno y responsivo.
    </p>

    <div id="container-02" class="mt-8 flex justify-center gap-4">
      <button id="start" class="inline-block px-6 py-3 text-white bg-brand rounded-base">
        Comenzar
      </button>
      <button id="demo" class="inline-block px-6 py-3 border border-default text-heading rounded-base">
        Ver demo
      </button>
    </div>
  </div>
</main>

<section class="bg-neutral-secondary-soft border-t border-default">
  <div id="container-03" class="px-4 py-8 mx-auto max-w-md md:max-w-xl">
    <div id="container-04" class="grid grid-cols-2 gap-4 md:grid-cols-4">
      <img src="https://placehold.co/50" alt="Imagen 1" class="w-full h-auto rounded-base">
      <img src="https://placehold.co/50" alt="Imagen 2" class="w-full h-auto rounded-base">
      <img src="https://placehold.co/50" alt="Imagen 3" class="w-full h-auto rounded-base">
      <img src="https://placehold.co/50" alt="Imagen 4" class="w-full h-auto rounded-base">
    </div>
  </div>
</section>

  
</body>

</html>
